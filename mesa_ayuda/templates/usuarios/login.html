{%extends "index.html"%}

{% load static %}

{% block content%}
{% if messages %}
{% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endfor %}
{% endif %}

<form action="" method="post" class="col-4 mt-5 m-auto p-3 card">
    <h3 class="text-center">Inicio de Sesión</h3>
    {% csrf_token %}
    <input type="email" name="correo" placeholder="Ingrese Correo" class="form-control" /><br>
    <input type="password" name="contraseña" placeholder="Ingrese Contraseña" class="form-control mt-2" /><br>
    
    <button type="submit" class="btn btn-primary mt-3">Iniciar</button>
</form>
{% endblock content%}
